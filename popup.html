<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 440px; margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; color: #1f1f1f; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  button { font: inherit; padding: 6px 10px; border: 1px solid #bbb; border-radius: 6px; background: #f6f6f6; cursor: pointer; }
  button.primary { background: #2f5fd0; color: #fff; border-color: #2f5fd0; }
  button:hover { filter: brightness(0.95); }
  .row { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; align-items: center; }
  #status { color: #555; min-height: 18px; }
  #list { margin: 6px 0; padding: 0; list-style: none; max-height: 110px; overflow: auto; }
  #list li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid #eee; }
  #list li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list button { padding: 0 6px; }
  textarea { width: 100%; box-sizing: border-box; height: 190px; font: 12px/1.4 ui-monospace, monospace; }
  label { display: flex; gap: 4px; align-items: center; }
  .hint { color: #777; font-size: 11px; }
</style>
</head>
<body>
  <h1>AI Chat Recorder</h1>
  <div class="row">
    <button id="capture" class="primary">Capture this tab's chat</button>
    <label><input type="checkbox" id="handoff" checked> Add hand-off instructions</label>
  </div>
  <div id="status"></div>
  <ul id="list"></ul>
  <textarea id="preview" placeholder="Captured chats appear here as Markdown. You can edit before copying."></textarea>
  <div class="row">
    <button id="copy">Copy</button>
    <button id="download">Download .md</button>
    <button id="clear">Clear all</button>
  </div>
  <div class="hint">Tip: scroll to the top of long chats first so every message is loaded. Select text on the page to capture only that part. Everything stays on your computer.</div>
  <script src="popup.js"></script>
</body>
</html>
